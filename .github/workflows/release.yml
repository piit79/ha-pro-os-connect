name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the integration version
        run: |
          version="$(jq -r .version custom_components/pro_os_connect/manifest.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in manifest.json" >&2
            exit 1
          fi

  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs:
      - check-version
      - tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The full history and tags are needed to find the previous release
          fetch-depth: 0
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if previous="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null)"; then
            range="$previous..$GITHUB_REF_NAME"
            compare="**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
          else
            range="$GITHUB_REF_NAME"
            compare=""
          fi
          {
            echo "## Changes"
            echo
            git log --no-merges --reverse --pretty='- %s (%h)' "$range"
            echo
            echo "$compare"
          } > notes.md
          # Replace --notes-file notes.md with --generate-notes if switching to pull requests
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
