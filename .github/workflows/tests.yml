name: Tests

on:
  push:
    # Tags are tested by the release workflow
    branches:
      - "**"
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          activate-environment: true
      - run: uv pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
