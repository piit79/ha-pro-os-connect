[project]
name = "ha-pro-os-connect"
version = "0.2.0"
description = "Home Assistant integration for Donaldson BOFA Pro OS Connect fume extractors"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "BLE", "C", "D", "E", "F", "I", "PL", "PT", "RUF", "SIM", "UP", "W"]
ignore = ["D202", "D203", "D213", "E501", "PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.pro_os_connect"]
known-third-party = ["homeassistant", "pro_os_connect"]
combine-as-imports = true
split-on-trailing-comma = false
